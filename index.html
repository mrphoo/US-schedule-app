<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimePilot v8.2 - Apex Engine</title>
    
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* =========================================
           CSS VARIABLES (Theme & Colors)
           ========================================= */
        :root {
            --bg-base: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.70);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(20px);
            
            --color-ai: #a855f7;
            --color-study: #3b82f6;
            --color-sleep: #10b981;
            --color-phone: #ef4444;
            --color-exercise: #f97316;
        }

        body.light-theme {
            --bg-base: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.80);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; transition: background-color 0.4s, color 0.4s; }

        /* 🛡️ pointer-events: none でタッチ遮断を100%防ぐ */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: var(--bg-base); transition: background 0.8s; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.50; animation: float 20s infinite ease-in-out alternate; pointer-events: none; }
        .blob-1 { top: -10%; left: -10%; width: 350px; height: 350px; background: var(--color-ai); }
        .blob-2 { bottom: 10%; right: -10%; width: 450px; height: 450px; background: var(--color-study); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 50%; width: 300px; height: 300px; background: var(--color-sleep); animation-delay: -10s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 60px) scale(1.15); } }

        /* LAYOUT & HEADER */
        .app-container { width: 100%; max-width: 560px; padding: 20px; z-index: 1; flex: 1; position: relative; }
        .app-page { display: none; animation: fadeIn 0.3s ease-out; }
        .app-page.active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header {
            width: 100%; max-width: 560px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 500; background: var(--glass-bg); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border);
        }
        .brand-logo { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .brand-icon-img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .theme-btn { background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; transition: transform 0.2s, color 0.3s; padding: 4px; }
        .theme-btn:active { transform: scale(0.85); }
        
        .level-badge { display: flex; flex-direction: column; align-items: flex-end; }
        .lvl-text { font-size: 13px; font-weight: 800; color: var(--color-study); }
        .exp-bar-bg { width: 70px; height: 6px; background: rgba(128,128,128,0.25); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .exp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--color-ai), var(--color-study)); width: 0%; transition: width 0.8s; }

        /* UI ELEMENTS */
        .glass-card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08); position: relative; }
        .section-title { font-size: 13px; font-weight: 800; color: var(--text-muted); margin: 24px 0 12px 4px; text-transform: uppercase; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .form-group label { font-size: 13px; font-weight: 700; }
        .form-row-twin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        input, select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.06); color: var(--text-main); font-size: 15px; outline: none; }
        body.light-theme input, body.light-theme select { background: rgba(0,0,0,0.03); color: #0f172a; }
        option { background-color: var(--bg-base); color: var(--text-main); }
        
        .btn-primary { width: 100%; background: linear-gradient(135deg, var(--color-ai), var(--color-study)); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25); display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform 0.1s, opacity 0.2s; position: relative; z-index: 10; }
        .btn-primary:active { transform: scale(0.96); opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        /* HOME / CHECKLIST / TIMELINE */
        .mission-item { display: flex; align-items: center; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 8px; transition: all 0.2s; }
        .mission-item.checked { opacity: 0.4; text-decoration: line-through; }
        .mission-color { width: 12px; height: 12px; border-radius: 4px; margin-right: 12px; flex-shrink: 0; }
        .mission-text { flex: 1; font-size: 13px; font-weight: 700; }
        .mission-time { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-right: 12px; font-family: monospace; }
        .check-circle { width: 24px; height: 24px; border: 2px solid var(--text-muted); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: transparent; transition: all 0.2s; }
        .mission-item.checked .check-circle { background: var(--color-sleep); border-color: var(--color-sleep); color: white; }
        
        /* 🚀 次世代AIプランカード UI */
        .plan-session-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden; transition: all 0.3s; }
        .plan-session-card:hover { border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.06); }
        .plan-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        .badge-focus { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-break { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-prep  { background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.4); }

        .plan-session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .plan-time-range { font-size: 14px; font-weight: 900; color: var(--text-main); font-family: monospace; }
        .plan-duration { font-size: 12px; font-weight: 700; color: var(--text-muted); }
        .plan-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: var(--text-main); }
        .plan-advice { font-size: 12px; color: var(--text-muted); line-height: 1.5; background: rgba(0,0,0,0.18); padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
        body.light-theme .plan-advice { background: rgba(0,0,0,0.04); }

        .btn-session-start { width: 100%; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 800; background: var(--color-study); color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .btn-session-start:active { transform: scale(0.96); }
        .btn-session-start.break-mode { background: var(--color-sleep); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        /* ANALYSIS SLIDERS */
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; height: 6px; padding: 0; border: none; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(128,128,128,0.3); border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: var(--text-main); margin-top: -6px; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.3); }

        /* CALENDAR / DRAWER / MODALS */
        .cal-header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-weekday { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; }
        .cal-cell { min-height: 70px; display: flex; flex-direction: column; align-items: center; padding: 4px; background: rgba(128,128,128,0.05); border: 1px solid var(--glass-border); border-radius: 10px; cursor: pointer; overflow: hidden; }
        .cal-cell.today { border: 2px solid var(--color-ai); background: rgba(168, 85, 247, 0.08); }
        .cal-date-num { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
        .cal-event-bar { width: 100%; padding: 2px 4px; border-radius: 4px; font-size: 9px; font-weight: 800; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; text-align: left; }

        .bottom-drawer { position: fixed; bottom: -100%; left: 0; width: 100%; height: 65vh; background: var(--bg-base); border-top: 1px solid var(--glass-border); border-radius: 24px 24px 0 0; z-index: 2000; transition: bottom 0.3s; padding: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .bottom-drawer.open { bottom: 0; }
        .color-opt { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-opt.selected { border-color: white; transform: scale(1.1); }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1500; display: none; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .overlay.show { display: block; opacity: 1; pointer-events: auto; }

        .timer-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.9); opacity: 0; background: var(--bg-base); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; width: 90%; max-width: 360px; z-index: 2100; text-align: center; transition: all 0.3s; pointer-events: none; }
        .timer-modal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
        .timer-ring { position: relative; width: 200px; height: 200px; margin: 10px auto 20px; }
        .timer-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .timer-ring circle { fill: none; stroke-width: 8; }
        .timer-bg { stroke: rgba(128,128,128,0.2); }
        .timer-progress { stroke: var(--color-study); stroke-linecap: round; transition: stroke-dashoffset 0.5s linear, stroke 0.3s; }
        .timer-time { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 36px; font-weight: 900; font-family: monospace; }
        .timer-controls { display: flex; justify-content: center; gap: 10px; }
        .timer-btn { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--glass-border); background: rgba(128,128,128,0.1); color: var(--text-main); font-size: 18px; cursor: pointer; }

        /* NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); border-top: 1px solid var(--glass-border); display: flex; justify-content: center; z-index: 1000; }
        .nav-inner { width: 100%; max-width: 560px; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { flex: 1; max-width: 100px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; transition: color 0.2s; }
        .nav-item.active { color: var(--color-ai); }
        .nav-item i { font-size: 20px; }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .app-container { padding: 12px; }
            header { padding: 12px 15px; }
            .glass-card { padding: 16px; border-radius: 16px; }
            .cal-grid { gap: 3px; }
            .cal-cell { min-height: 60px; }
        }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="brand-logo">
            <img src="icon.png" class="brand-icon-img" alt="TimePilot">
            <span>TimePilot</span>
        </div>
        <div class="header-actions">
            <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="テーマ切替"><i class="fa-solid fa-moon"></i></button>
            <div class="level-badge">
                <div class="lvl-text" id="level-text">Lv.1</div>
                <div class="exp-bar-bg"><div class="exp-bar-fill" id="exp-fill"></div></div>
            </div>
        </div>
    </header>

    <main class="app-container">
        <section class="app-page active-page" id="page-home">
            <div class="section-title">TODAY</div>
            <div class="glass-card">
                <div id="home-date" style="font-size:12px;color:var(--text-muted);font-weight:700;margin-bottom:8px;"></div>
                <div id="today-missions"></div>
                <div id="empty-mission" style="display:none;text-align:center;color:var(--text-muted);font-size:12px;padding:20px 0;">今日の予定はありません</div>
            </div>
            <div class="section-title">QUICK ACTION</div>
            <div class="glass-card">
                <button class="btn-primary" onclick="openTimerModal(1500)"><i class="fa-solid fa-stopwatch"></i> 集中タイマー</button>
            </div>
        </section>

        <section class="app-page" id="page-calendar">
            <div class="section-title">CALENDAR</div>
            <div class="glass-card">
                <div class="cal-header-nav">
                    <button class="timer-btn" onclick="changeMonth(-1)" style="width:40px;height:40px;font-size:14px;"><i class="fa-solid fa-chevron-left"></i></button>
                    <strong id="cal-month-title"></strong>
                    <button class="timer-btn" onclick="changeMonth(1)" style="width:40px;height:40px;font-size:14px;"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div id="calendar-grid" class="cal-grid"></div>
            </div>
        </section>

        <section class="app-page" id="page-ai">
            <div class="section-title">AI PLANNER</div>
            <div class="glass-card">
                <div class="form-group">
                    <label for="ai-goal">今日の目標</label>
                    <input id="ai-goal" type="text" placeholder="例：数学を2時間進める">
                </div>
                <button class="btn-primary" onclick="generateAIPlan()"><i class="fa-solid fa-wand-magic-sparkles"></i> AIプランを作成</button>
                <div id="ai-result" style="margin-top:16px;"></div>
            </div>
        </section>

        <section class="app-page" id="page-settings">
            <div class="section-title">SETTINGS</div>
            <div class="glass-card">
                <div class="form-group">
                    <label for="pref-select">都道府県</label>
                    <select id="pref-select" onchange="onPrefChange()"></select>
                </div>
                <div class="form-group">
                    <label for="city-select">市区町村</label>
                    <select id="city-select" onchange="onCityChange()"></select>
                </div>
                <div class="form-group">
                    <label for="api-key">Groq API Key</label>
                    <input id="api-key" type="password" placeholder="gsk_...">
                </div>
                <button class="btn-primary" onclick="saveSettings()"><i class="fa-solid fa-floppy-disk"></i> 設定を保存</button>
            </div>
        </section>
    </main>

    <div class="overlay" id="global-overlay" onclick="closeAllModals()"></div>

    <div class="timer-modal" id="timer-modal">
        <h2 style="font-size:18px;">集中タイマー</h2>
        <div class="timer-ring">
            <svg viewBox="0 0 220 220">
                <circle class="timer-bg" cx="110" cy="110" r="100"></circle>
                <circle class="timer-progress" id="timer-progress" cx="110" cy="110" r="100" stroke-dasharray="628" stroke-dashoffset="0"></circle>
            </svg>
            <div class="timer-time" id="time-text">25:00</div>
        </div>
        <div class="timer-controls">
            <button class="timer-btn" onclick="toggleTimer()" aria-label="開始・停止"><i class="fa-solid fa-play" id="timer-play-icon"></i></button>
            <button class="timer-btn" onclick="resetTimer()" aria-label="リセット"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="timer-btn" onclick="closeTimerModal()" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-inner">
            <div class="nav-item active" onclick="switchPage('home', this)"><i class="fa-solid fa-house"></i><span>ホーム</span></div>
            <div class="nav-item" onclick="switchPage('calendar', this)"><i class="fa-solid fa-calendar-days"></i><span>カレンダー</span></div>
            <div class="nav-item" onclick="switchPage('ai', this)"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI</span></div>
            <div class="nav-item" onclick="switchPage('settings', this)"><i class="fa-solid fa-gear"></i><span>設定</span></div>
        </div>
    </div>

    <script>
        const geoMaster = {
            "東京都": [{name:"新宿区", lat:35.6938, lon:139.7034}],
            "大阪府": [{name:"大阪市", lat:34.6937, lon:135.5023}],
            "京都府": [{name:"京都市", lat:35.0116, lon:135.7681}],
            "愛知県": [{name:"名古屋市", lat:35.1815, lon:136.9066}],
            "石川県": [{name:"金沢市", lat:36.5613, lon:136.6562}]
        };

        const safeStorage = {
            get(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
            set(key, value) { try { localStorage.setItem(key, value); } catch(e) {} },
            remove(key) { try { localStorage.removeItem(key); } catch(e) {} }
        };

        let appState = {
            exp: parseInt(safeStorage.get('tp_exp_v800')) || 0,
            calendar: JSON.parse(safeStorage.get('tp_cal_v800')) || {},
            apiKey: safeStorage.get('tp_api_v800') || "",
            pref: safeStorage.get('tp_pref_v800') || "東京都",
            city: safeStorage.get('tp_city_v800') || JSON.stringify(geoMaster["東京都"][0]),
            theme: safeStorage.get('tp_theme_v800') || "dark",
            tutorialDone: safeStorage.get('tp_tut_v800') === 'true'
        };

        let currentDate = new Date();
        let timerDuration = 1500;
        let timerRemaining = 1500;
        let timerInterval = null;
        let timerRunning = false;

        function switchPage(page, el) {
            document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + page).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleTheme() {
            appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
            document.body.classList.toggle('light-theme', appState.theme === 'light');
            safeStorage.set('tp_theme_v800', appState.theme);
            document.getElementById('theme-toggle').innerHTML = appState.theme === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        }

        function initTheme() {
            document.body.classList.toggle('light-theme', appState.theme === 'light');
            document.getElementById('theme-toggle').innerHTML = appState.theme === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        }

        function updateLevel() {
            const level = Math.floor(appState.exp / 100) + 1;
            const progress = appState.exp % 100;
            document.getElementById('level-text').innerText = `Lv.${level}`;
            document.getElementById('exp-fill').style.width = progress + '%';
        }

        function renderHome() {
            const now = new Date();
            document.getElementById('home-date').innerText = now.toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
            const key = now.toISOString().slice(0,10);
            const missions = appState.calendar[key] || [];
            const container = document.getElementById('today-missions');
            container.innerHTML = '';
            document.getElementById('empty-mission').style.display = missions.length ? 'none' : 'block';
            missions.forEach((m, i) => {
                const item = document.createElement('div');
                item.className = 'mission-item' + (m.done ? ' checked' : '');
                item.innerHTML = `<div class="mission-color" style="background:${m.color || 'var(--color-study)'}"></div><div class="mission-text">${m.title || '予定'}</div><div class="mission-time">${m.time || ''}</div><div class="check-circle" onclick="toggleMission('${key}', ${i})"><i class="fa-solid fa-check"></i></div>`;
                container.appendChild(item);
            });
        }

        function toggleMission(key, index) {
            if (!appState.calendar[key]?.[index]) return;
            appState.calendar[key][index].done = !appState.calendar[key][index].done;
            safeStorage.set('tp_cal_v800', JSON.stringify(appState.calendar));
            renderHome();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('cal-month-title').innerText = `${year}年${month + 1}月`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            ['日','月','火','水','木','金','土'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'cal-weekday';
                el.innerText = d;
                grid.appendChild(el);
            });
            const first = new Date(year, month, 1).getDay();
            const days = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
            for (let day = 1; day <= days; day++) {
                const el = document.createElement('div');
                el.className = 'cal-cell';
                const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const today = new Date();
                if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) el.classList.add('today');
                el.innerHTML = `<div class="cal-date-num">${day}</div>`;
                (appState.calendar[key] || []).slice(0,3).forEach(m => {
                    const bar = document.createElement('div');
                    bar.className = 'cal-event-bar';
                    bar.style.background = m.color || 'var(--color-study)';
                    bar.innerText = m.title || '予定';
                    el.appendChild(bar);
                });
                grid.appendChild(el);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function openTimerModal(duration = 1500) {
            timerDuration = duration;
            timerRemaining = duration;
            timerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timer-modal').classList.add('show');
            updateTimerDisplay();
            document.getElementById('timer-play-icon').className = 'fa-solid fa-play';
        }

        function closeTimerModal() {
            document.getElementById('timer-modal').classList.remove('show');
            clearInterval(timerInterval);
            timerRunning = false;
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
            document.getElementById('timer-play-icon').className = timerRunning ? 'fa-solid fa-pause' : 'fa-solid fa-play';
            if (timerRunning) {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (timerRemaining <= 0) {
                        clearInterval(timerInterval);
                        timerRunning = false;
                        document.getElementById('timer-play-icon').className = 'fa-solid fa-play';
                        return;
                    }
                    timerRemaining--;
                    updateTimerDisplay();
                }, 1000);
            } else {
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            timerRemaining = timerDuration;
            document.getElementById('timer-play-icon').className = 'fa-solid fa-play';
            updateTimerDisplay();
        }

        function closeAllModals() {
            closeTimerModal();
        }

        function updateTimerDisplay() {
            const safeDuration = timerDuration || 1500;
            document.getElementById('time-text').innerText = `${String(Math.floor(timerRemaining / 60)).padStart(2,'0')}:${String(timerRemaining % 60).padStart(2,'0')}`;
            document.getElementById('timer-progress').style.strokeDashoffset = 628 - (timerRemaining / safeDuration) * 628;
            document.getElementById('timer-progress').style.stroke = timerRemaining < 60 ? "var(--color-phone)" : "var(--color-study)";
        }

        function initSettings() {
            const pref = document.getElementById('pref-select');
            pref.innerHTML = Object.keys(geoMaster).map(p => `<option value="${p}">${p}</option>`).join('');
            pref.value = appState.pref;
            onPrefChange();
            document.getElementById('api-key').value = appState.apiKey;
        }

        function onPrefChange() {
            const pref = document.getElementById('pref-select').value;
            const city = document.getElementById('city-select');
            city.innerHTML = (geoMaster[pref] || []).map(c => `<option value='${JSON.stringify(c)}'>${c.name}</option>`).join('');
            const saved = JSON.parse(appState.city || '{}');
            const found = (geoMaster[pref] || []).find(c => c.name === saved.name);
            city.value = JSON.stringify(found || geoMaster[pref][0]);
        }

        function onCityChange() {
            appState.city = document.getElementById('city-select').value;
        }

        function saveSettings() {
            appState.pref = document.getElementById('pref-select').value;
            appState.city = document.getElementById('city-select').value;
            appState.apiKey = document.getElementById('api-key').value.trim();
            safeStorage.set('tp_pref_v800', appState.pref);
            safeStorage.set('tp_city_v800', appState.city);
            safeStorage.set('tp_api_v800', appState.apiKey);
            alert('設定を保存しました。');
        }

        async function generateAIPlan() {
            const goal = document.getElementById('ai-goal').value.trim();
            const result = document.getElementById('ai-result');
            if (!goal) return;
            if (!appState.apiKey) {
                result.innerHTML = '<div style="color:var(--color-phone);font-size:12px;">設定からGroq API Keyを登録してください。</div>';
                return;
            }
            result.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">AIが計画を作成中...</div>';
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json','Authorization':`Bearer ${appState.apiKey}`},
                    body: JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:`高校生向けに、次の目標を今日の具体的な学習計画にしてください。目標: ${goal}`}],temperature:0.4})
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || 'AI request failed');
                result.innerHTML = `<div class="plan-session-card"><div class="plan-title">AIプラン</div><div class="plan-advice">${String(data.choices?.[0]?.message?.content || '計画を取得できませんでした。').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div></div>`;
            } catch (e) {
                console.error(e);
                result.innerHTML = '<div style="color:var(--color-phone);font-size:12px;">AIプランの作成に失敗しました。</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateLevel();
            renderHome();
            renderCalendar();
            initSettings();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
    
</body>
</html>
