name: Integrate TimePilot v8.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate v8.3 improvements
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'src="home-v83.js"' not in text:
              marker = '<script src="auth-ui.js"></script>'
              if marker not in text:
                  raise SystemExit('auth-ui.js script marker not found')
              text = text.replace(marker, marker + '\n<script src="home-v83.js"></script>', 1)

          text = text.replace('TimePilot v8.2 - Apex Engine', 'TimePilot v8.3 - Apex Engine', 1)
          text = text.replace('TimePilot v8.0</div>', 'TimePilot v8.3</div>', 1)

          path.write_text(text, encoding='utf-8')
          print('Integrated TimePilot v8.3.')

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade TimePilot to v8.3 home and calendar UX"
          git push
