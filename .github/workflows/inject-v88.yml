name: Load TimePilot v8.8

on:
  push:
    branches: [main]
    paths:
      - 'personalization-v88.js'
      - 'reschedule-v88.js'
      - 'adaptive-v89.js'
      - 'app-options-v89.js'
      - 'auth-hardening-v90.js'
      - 'cloud-sync-v90.js'
      - 'cloud-sync-trigger-v90.js'
      - '.github/workflows/inject-v88.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject adaptive modules
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="personalization-v88.js"></script>',
              '<script src="reschedule-v88.js"></script>',
              '<script src="adaptive-v89.js"></script>',
              '<script src="app-options-v89.js"></script>',
              '<script src="auth-hardening-v90.js"></script>',
              '<script src="cloud-sync-v90.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  marker = '</body>'
                  if marker not in s:
                      raise SystemExit('index.html: </body> not found')
                  s = s.replace(marker, f'    {tag}\n{marker}', 1)
          s = s.replace('<title>TimePilot v8.4.2 - Apex Engine</title>', '<title>TimePilot v8.8 - Adaptive Engine</title>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: inject cloud data sync'
            git push
          fi
