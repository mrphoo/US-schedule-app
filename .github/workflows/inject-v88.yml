name: Load TimePilot v8.8

on:
  push:
    branches: [main]
    paths:
      - 'personalization-v88.js'
      - 'reschedule-v88.js'
      - '.github/workflows/inject-v88.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject v8.8 modules once and unify typography
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="personalization-v88.js"></script>',
              '<script src="reschedule-v88.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  marker = '</body>'
                  if marker not in s:
                      raise SystemExit('index.html: </body> not found')
                  s = s.replace(marker, f'    {tag}\n{marker}', 1)
          s = s.replace('<title>TimePilot v8.4.2 - Apex Engine</title>', '<title>TimePilot v8.8 - Adaptive Engine</title>', 1)
          p.write_text(s, encoding='utf-8')

          # Keep both personalization states visually consistent with the AI recovery card.
          p = Path('personalization-v88.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.tp88-title{font-size:15px;font-weight:900}', '.tp88-title{font-size:15px;font-weight:900;line-height:1.35;font-family:inherit}')
          s = s.replace('<div class="tp88-title">初期設定</div>', '<div class="tp88-title">あなた専用AIの初期設定</div>')
          p.write_text(s, encoding='utf-8')
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html personalization-v88.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: unify personalization typography in both states'
            git push
          fi
