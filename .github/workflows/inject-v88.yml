name: Load TimePilot v8.8

on:
  push:
    branches: [main]
    paths:
      - 'personalization-v88.js'
      - 'reschedule-v88.js'
      - '.github/workflows/inject-v88.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject v8.8 modules and compact adaptive learning
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="personalization-v88.js"></script>',
              '<script src="reschedule-v88.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  marker = '</body>'
                  if marker not in s:
                      raise SystemExit('index.html: </body> not found')
                  s = s.replace(marker, f'    {tag}\n{marker}', 1)
          s = s.replace('<title>TimePilot v8.4.2 - Apex Engine</title>', '<title>TimePilot v8.8 - Adaptive Engine</title>', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('personalization-v88.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.tp88-title{font-size:15px;font-weight:900}', '.tp88-title{font-size:15px;font-weight:900;line-height:1.35;font-family:inherit}')
          s = s.replace('<div class="tp88-title">初期設定</div>', '<div class="tp88-title">あなた専用AIの初期設定</div>')

          start = s.find('  function adaptiveLearning(records) {')
          end = s.find('  function behaviorSummary() {')
          if start >= 0 and end > start:
              engine = '''  function adaptiveLearning(records) {
    const tasks = {}, hours = {};
    records.forEach(r => {
      const title = String(r.title || '').replace(/\\s*（\\d+分）/g, '').replace(/\\s*（延期）/g, '').trim().slice(0, 24);
      const minutes = Number(r.minutes) || 0;
      if (title && minutes > 0) {
        const x = tasks[title] || { count: 0, total: 0, values: [] };
        x.count++; x.total += minutes; x.values.push(minutes); tasks[title] = x;
      }
      const h = String(r.time || '').slice(0, 2);
      if (/^\\d\\d$/.test(h)) {
        const x = hours[h] || { count: 0, minutes: 0 };
        x.count++; x.minutes += minutes; hours[h] = x;
      }
    });
    const task_profiles = Object.entries(tasks)
      .sort((a,b) => (b[1].count-a[1].count) || (b[1].total-a[1].total))
      .slice(0, 8)
      .map(([title,x]) => {
        const avg = x.total / x.count;
        const variance = x.values.reduce((sum,v) => sum + Math.pow(v-avg,2), 0) / x.count;
        return {
          title,
          count: x.count,
          avg_minutes: Math.round(avg),
          consistency: Math.max(0, Math.round(100 - (Math.sqrt(variance) / Math.max(avg, 1)) * 100))
        };
      });
    const bestHour = Object.entries(hours).sort((a,b) => (b[1].minutes-a[1].minutes) || (b[1].count-a[1].count))[0];
    return {
      task_profiles,
      best_hour: bestHour ? `${bestHour[0]}時台` : null,
      sample_size: records.length
    };
  }

'''
              s = s[:start] + engine + s[end:]

          old = "    return {record_count:records.length,total_minutes:records.reduce((s,r)=>s+(Number(r.minutes)||0),0),recent:records.slice(-8).map(r=>({time:r.time,title:r.title,minutes:r.minutes,type:r.type})),strongest_hour:strongest?`${strongest[0]}時台`:'まだ判定できない',record_types:byType};"
          new = "    return {record_count:records.length,total_minutes:records.reduce((s,r)=>s+(Number(r.minutes)||0),0),recent:records.slice(-8).map(r=>({time:r.time,title:r.title,minutes:r.minutes,type:r.type})),strongest_hour:strongest?`${strongest[0]}時台`:'まだ判定できない',record_types:byType,adaptive:adaptiveLearning(records)};"
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html personalization-v88.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: strengthen compact adaptive learning'
            git push
          fi
