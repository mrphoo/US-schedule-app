name: Integrate TimePilot v8.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-v84.js'
      - 'supabase/functions/timepilot-ai/index.ts'
      - '.github/workflows/integrate-v84.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrate v8.4 client and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('TimePilot v8.3 - Apex Engine', 'TimePilot v8.4 - Apex Engine', 1)
          s = s.replace('TimePilot v8.3</div>', 'TimePilot v8.4</div>', 1)
          s = s.replace('TimePilot v8.0.0 (Apex Bulletproof Engine)', 'TimePilot v8.4.0 (Secure AI Gateway)', 1)

          if 'src="ai-v84.js"' not in s:
              s = s.replace('<script src="home-v83.js"></script>', '<script src="home-v83.js"></script>\n<script src="ai-v84.js"></script>')

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Integrate TimePilot v8.4 secure AI gateway'
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/integrate-v84.yml
          git commit -m 'Remove temporary v8.4 integration workflow'
          git push
