name: Restore TimePilot app structure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index.html from the last complete app version
        shell: bash
        run: |
          git show c800232cb41cc16d5df9bcc6fb30a9e838f86019:index.html > index.html
          sed -i 's/TimePilot v8\.0 - Apex Engine/TimePilot v8.2 - Apex Engine/g; s/TimePilot v8\.1 - Apex Engine/TimePilot v8.2 - Apex Engine/g' index.html

      - name: Commit restored app
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore complete TimePilot app structure v8.2"
          git push
