name: Patch TimePilot v8.4.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-v84.js'
      - '.github/workflows/patch-v841.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('TimePilot v8.4 - Apex Engine', 'TimePilot v8.4.1 - Apex Engine', 1)
          s = s.replace('TimePilot v8.4</div>', 'TimePilot v8.4.1</div>', 1)
          s = s.replace('TimePilot v8.4.0 (Secure AI Gateway)', 'TimePilot v8.4.1 (Secure AI Gateway)', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Bump TimePilot to v8.4.1'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-v841.yml
          git commit -m 'Remove temporary v8.4.1 patch workflow'
          git push
